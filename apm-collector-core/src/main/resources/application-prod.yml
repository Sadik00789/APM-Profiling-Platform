server:
  port: 8080

spring:
  application:
    name: apm-collector-core
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

apm:
  clickhouse:
    url: ${CLICKHOUSE_URL:jdbc:ch://clickhouse:8123/default}
    user: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    pool:
      max-size: 64
      min-idle: 16
      idle-timeout-ms: 30000
      max-lifetime-ms: 600000
      connection-timeout-ms: 15000
  storage:
    batch:
      buffer-capacity: 100000
      max-batch-size: 10000
      flush-interval-ms: 250
  disruptor:
    ring-buffer-size: 131072
  anomaly:
    window-seconds: 60
    p95-alert-threshold-ms: 200.0
    p99-alert-threshold-ms: 450.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
